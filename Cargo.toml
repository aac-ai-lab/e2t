[package]
name = "e2t"
version = "0.2.0"
edition = "2021"
description = "Dicionário emoji → token/word: geração automática e completa a partir de Unicode e tokenizador"
readme = "README.md"
license = "MIT"
repository = "https://github.com/aac-ai-lab/e2t"
keywords = ["emoji", "tokenization", "Unicode", "NLP", "dictionary"]

default-run = "e2t"

[[bin]]
name = "e2t"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
tokenizers = "0.19"
walkdir = "2"
thiserror = "1.0"
anyhow = "1.0"
unicode_names2 = "2"

[dev-dependencies]
tempfile = "3"
