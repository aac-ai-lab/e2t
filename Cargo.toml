[package]
name = "e2t"
version = "0.1.0"
edition = "2021"
description = "Mapeamento emoji → token/word: dataset e métricas para tokenização de emojis"
readme = "README.md"
license = "MIT"
repository = "https://github.com/SEU-USUARIO/e2t"
keywords = ["emoji", "tokenization", "Unicode", "NLP", "dataset"]

default-run = "e2t"

[[bin]]
name = "e2t"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
tokenizers = "0.19"
walkdir = "2"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"
