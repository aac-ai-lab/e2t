name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@2

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@2

      - name: Build release
        run: cargo build --release

      - name: Run CLI help
        run: ./target/release/e2t --help

      - name: Fetch emoji list (fixtures)
        run: ./target/release/e2t fetch-emoji-list tests/fixtures/emoji-data-sample.txt --output /tmp/emoji_list.txt

      - name: Validate sample CSV
        run: ./target/release/e2t validate data/emoji_dictionary_sample.csv
